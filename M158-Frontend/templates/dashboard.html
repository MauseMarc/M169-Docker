<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Maus of Roadstreet</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0a0e0a;
    color: #c8d8c0;
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── Header ── */
  .header {
    background: #111a11;
    border-bottom: 1px solid #2a3d2a;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  .header .logo {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 20px;
    color: #5dba5d;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .header .invite-pill {
    font-size: 11px;
    color: #6a8a6a;
    letter-spacing: 1px;
  }

  .header .invite-pill span {
    color: #5dba5d;
    font-weight: bold;
  }

  /* ── Company Bar ── */
  .company-bar {
    background: #0d160d;
    border-bottom: 1px solid #1e2e1e;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
    flex-shrink: 0;
  }

  .company-bar .co-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: #e8f4e8;
    letter-spacing: 1px;
  }

  .company-bar .co-type {
    font-size: 11px;
    color: #6a8a6a;
    letter-spacing: 1px;
    text-transform: uppercase;
    background: #111a11;
    border: 1px solid #2a3d2a;
    padding: 3px 8px;
    border-radius: 2px;
  }

  .company-bar .co-cash {
    margin-left: auto;
    text-align: right;
  }

  .company-bar .co-cash .label {
    font-size: 10px;
    color: #6a8a6a;
    letter-spacing: 1px;
  }

  .company-bar .co-cash .amount {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 26px;
    font-weight: 700;
    color: #5dba5d;
  }

  /* ── Main Content ── */
  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 0;
    overflow-y: auto;
    padding: 16px;
  }

  .section {
    background: #111a11;
    border: 1px solid #2a3d2a;
    border-radius: 4px;
    margin-bottom: 14px;
  }

  .section-header {
    padding: 10px 16px;
    border-bottom: 1px solid #2a3d2a;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .section-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: #5dba5d;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .section-meta {
    font-size: 10px;
    color: #4a6a4a;
  }

  /* ── Stock Panel ── */
  .stock-body {
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .stock-info {
    flex-shrink: 0;
  }

  .stock-price {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 36px;
    font-weight: 700;
    line-height: 1;
  }

  .stock-price.up   { color: #5dba5d; }
  .stock-price.down { color: #c05050; }
  .stock-price.flat { color: #c8d8c0; }

  .stock-change {
    font-size: 12px;
    margin-top: 4px;
  }

  .stock-change.up   { color: #5dba5d; }
  .stock-change.down { color: #c05050; }
  .stock-change.flat { color: #6a8a6a; }

  .stock-updated {
    font-size: 10px;
    color: #4a6a4a;
    margin-top: 2px;
  }

  .stock-chart {
    flex: 1;
    min-width: 0;
  }

  canvas#stock-canvas {
    display: block;
    width: 100%;
    height: 80px;
  }

  /* ── Inbox ── */
  .inbox-list {
    padding: 6px 0;
    max-height: 300px;
    overflow-y: auto;
  }

  .inbox-item {
    padding: 10px 16px;
    border-bottom: 1px solid #1a2a1a;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .inbox-item:last-child {
    border-bottom: none;
  }

  .inbox-ts {
    font-size: 10px;
    color: #4a6a4a;
  }

  .inbox-msg {
    font-size: 13px;
    color: #c8d8c0;
    line-height: 1.4;
  }

  .inbox-item.good {
    border-left: 3px solid #2a5a2a;
    background: #0d200d;
    padding-left: 13px;
  }

  .inbox-item.good .inbox-msg { color: #7dd87d; }

  .inbox-item.bad {
    border-left: 3px solid #5a2a2a;
    background: #200d0d;
    padding-left: 13px;
  }

  .inbox-item.bad .inbox-msg { color: #d07070; }

  .inbox-empty {
    padding: 18px 16px;
    font-size: 12px;
    color: #3a5a3a;
    text-align: center;
  }

  /* ── Status Effects ── */
  .status-list {
    padding: 10px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .status-empty {
    padding: 18px 16px;
    font-size: 12px;
    color: #3a5a3a;
    text-align: center;
  }

  .status-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    border-radius: 3px;
    border: 1px solid transparent;
  }

  .status-item.good {
    background: #0d200d;
    border-color: #2a5a2a;
  }

  .status-item.bad {
    background: #200d0d;
    border-color: #5a2a2a;
  }

  .status-icon {
    font-size: 16px;
    flex-shrink: 0;
    width: 20px;
    text-align: center;
  }

  .status-main {
    flex: 1;
    min-width: 0;
  }

  .status-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 1px;
  }

  .status-item.good .status-name { color: #5dba5d; }
  .status-item.bad  .status-name { color: #d07070; }

  .status-duration {
    font-size: 10px;
    color: #6a8a6a;
    margin-top: 2px;
  }

  .status-right {
    text-align: right;
    flex-shrink: 0;
  }

  .status-severity {
    display: flex;
    gap: 3px;
    justify-content: flex-end;
  }

  .sev-pip {
    width: 8px;
    height: 8px;
    border-radius: 1px;
  }

  .status-item.good .sev-pip.filled { background: #5dba5d; }
  .status-item.good .sev-pip.empty  { background: #1a3a1a; }
  .status-item.bad  .sev-pip.filled { background: #d07070; }
  .status-item.bad  .sev-pip.empty  { background: #3a1a1a; }

  /* ── Refresh indicator ── */
  .pulse-dot {
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #5dba5d;
    margin-right: 6px;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.3; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="logo">Maus of Roadstreet</div>
  <div class="invite-pill">CODE <span id="hdr-code">—</span></div>
</div>

<div class="company-bar">
  <div>
    <div class="co-name" id="co-name">—</div>
    <div class="co-type" id="co-type">—</div>
  </div>
  <div class="co-cash">
    <div class="label">CASH</div>
    <div class="amount" id="co-cash">—</div>
  </div>
</div>

<div class="content">

  <!-- Stock Section -->
  <div class="section">
    <div class="section-header">
      <div class="section-title"><span class="pulse-dot"></span>Your Stock</div>
      <div class="section-meta" id="stock-updated">—</div>
    </div>
    <div class="stock-body">
      <div class="stock-info">
        <div class="stock-price flat" id="stock-price">—</div>
        <div class="stock-change flat" id="stock-change">—</div>
        <div class="stock-updated" id="stock-ts"></div>
      </div>
      <div class="stock-chart">
        <canvas id="stock-canvas"></canvas>
      </div>
    </div>
  </div>

  <!-- Status Effects Section -->
  <div class="section">
    <div class="section-header">
      <div class="section-title">Active Effects</div>
      <div class="section-meta" id="status-count">—</div>
    </div>
    <div id="status-list">
      <div class="status-empty">No active effects.</div>
    </div>
  </div>

  <!-- Inbox Section -->
  <div class="section">
    <div class="section-header">
      <div class="section-title">Inbox</div>
      <div class="section-meta" id="inbox-count">0 messages</div>
    </div>
    <div class="inbox-list" id="inbox-list">
      <div class="inbox-empty">No messages.</div>
    </div>
  </div>

</div>

<script>
  const INVITE_CODE = {{ invite_code | tojson }};
  const GAME = `http://${window.location.hostname}:5000`;

  document.getElementById('hdr-code').textContent = INVITE_CODE;

  // ── Cookie helpers ──
  function getCookie(name) {
    const match = document.cookie.match(new RegExp('(?:^|; )' + name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '=([^;]*)'));
    return match ? decodeURIComponent(match[1]) : null;
  }

  // Ensure cookie is set
  document.cookie = `invite_code=${INVITE_CODE}; path=/; max-age=2592000; SameSite=Lax`;

  // ── Sparkline ──
  let stockHistory = [];
  let stockTrend = 'flat';

  function drawSparkline(canvas, history, trend) {
    const W = canvas.offsetWidth || 260;
    const H = canvas.offsetHeight || 80;
    canvas.width  = W * window.devicePixelRatio;
    canvas.height = H * window.devicePixelRatio;
    const ctx = canvas.getContext('2d');
    ctx.scale(window.devicePixelRatio, window.devicePixelRatio);

    if (!history || history.length < 2) return;

    const min = Math.min(...history);
    const max = Math.max(...history);
    const range = (max - min) || 1;
    const pad = 6;

    const pts = history.map((v, i) => ({
      x: pad + (i / (history.length - 1)) * (W - 2 * pad),
      y: H - pad - ((v - min) / range) * (H - 2 * pad)
    }));

    const lineColor = trend === 'up' ? '#5dba5d' : trend === 'down' ? '#c05050' : '#7a9a7a';
    const fillTop   = trend === 'up' ? 'rgba(93,186,93,0.22)' : trend === 'down' ? 'rgba(192,80,80,0.22)' : 'rgba(122,154,122,0.18)';

    // Fill
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, fillTop);
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    pts.slice(1).forEach(p => ctx.lineTo(p.x, p.y));
    ctx.lineTo(pts[pts.length - 1].x, H);
    ctx.lineTo(pts[0].x, H);
    ctx.closePath();
    ctx.fillStyle = grad;
    ctx.fill();

    // Line
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    pts.slice(1).forEach(p => ctx.lineTo(p.x, p.y));
    ctx.strokeStyle = lineColor;
    ctx.lineWidth = 2;
    ctx.lineJoin = 'round';
    ctx.stroke();

    // End dot
    const last = pts[pts.length - 1];
    ctx.beginPath();
    ctx.arc(last.x, last.y, 4, 0, Math.PI * 2);
    ctx.fillStyle = lineColor;
    ctx.fill();
  }

  window.addEventListener('resize', () => {
    if (stockHistory.length) drawSparkline(document.getElementById('stock-canvas'), stockHistory, stockTrend);
  });

  // ── Load company data ──
  async function loadData() {
    try {
      const resp = await fetch(`${GAME}/api/player/data?invite_code=${encodeURIComponent(INVITE_CODE)}`);
      const data = await resp.json();
      document.getElementById('co-name').textContent  = data.company_name || '—';
      document.getElementById('co-type').textContent  = (data.company_type || '—').toUpperCase();
      document.getElementById('co-cash').textContent  = data.cash != null ? `$${data.cash.toLocaleString()}` : '—';
    } catch (e) { /* silently fail */ }
  }

  // ── Load stock ──
  async function loadStock() {
    try {
      const resp = await fetch(`${GAME}/api/player/stock?invite_code=${encodeURIComponent(INVITE_CODE)}`);
      const data = await resp.json();

      const priceEl  = document.getElementById('stock-price');
      const changeEl = document.getElementById('stock-change');
      const tsEl     = document.getElementById('stock-ts');
      const updEl    = document.getElementById('stock-updated');

      const trend = data.trend || 'flat';
      stockTrend  = trend;
      stockHistory = data.history || [];

      priceEl.textContent  = data.current_price != null ? `$${data.current_price}` : '—';
      priceEl.className    = `stock-price ${trend}`;

      const sign = data.change_percent > 0 ? '+' : '';
      changeEl.textContent = data.change_percent != null ? `${sign}${data.change_percent}%` : '—';
      changeEl.className   = `stock-change ${trend}`;

      tsEl.textContent  = data.last_updated ? `Updated ${data.last_updated}` : '';
      updEl.textContent = data.last_updated || '';

      requestAnimationFrame(() => drawSparkline(document.getElementById('stock-canvas'), stockHistory, stockTrend));
    } catch (e) { /* silently fail */ }
  }

  // ── Load status effects ──
  async function loadStatus() {
    try {
      const resp = await fetch(`${GAME}/api/player/status?invite_code=${encodeURIComponent(INVITE_CODE)}`);
      const data = await resp.json();
      const list = Array.isArray(data) ? data : [data];
      const active = list.filter(s => s && s.status_name);

      const container = document.getElementById('status-list');
      const countEl   = document.getElementById('status-count');

      if (active.length === 0) {
        countEl.textContent = 'none';
        container.innerHTML = '<div class="status-empty">No active effects.</div>';
        return;
      }

      countEl.textContent = `${active.length} active`;

      const MAX_PIPS = 5;
      container.innerHTML = '<div class="status-list">' + active.map(s => {
        const isGood = s.status_effect == 1;
        const cls    = isGood ? 'good' : 'bad';
        const icon   = isGood ? '▲' : '▼';
        const sev    = Math.min(Math.max(parseInt(s.severity) || 0, 0), MAX_PIPS);
        const pips   = Array.from({ length: MAX_PIPS }, (_, i) =>
          `<div class="sev-pip ${i < sev ? 'filled' : 'empty'}"></div>`
        ).join('');
        return `
          <div class="status-item ${cls}">
            <div class="status-icon">${icon}</div>
            <div class="status-main">
              <div class="status-name">${s.status_name}</div>
              <div class="status-duration">Ends ${s.duration || '—'}</div>
            </div>
            <div class="status-right">
              <div class="status-severity">${pips}</div>
            </div>
          </div>`;
      }).join('') + '</div>';
    } catch (e) { /* silently fail */ }
  }

  // ── Load inbox ──
  async function loadInbox() {
    try {
      const resp = await fetch(`${GAME}/api/player/Inbox?invite_code=${encodeURIComponent(INVITE_CODE)}`);
      const data = await resp.json();
      const list = Array.isArray(data) ? data : (data.messages || []);
      const container = document.getElementById('inbox-list');
      document.getElementById('inbox-count').textContent = `${list.length} message${list.length !== 1 ? 's' : ''}`;

      if (list.length === 0) {
        container.innerHTML = '<div class="inbox-empty">No messages.</div>';
        return;
      }

      container.innerHTML = list.slice().reverse().map(item => {
        const dirCls = item.direction === 1 ? 'good' : item.direction === 0 ? 'bad' : '';
        return `
        <div class="inbox-item${dirCls ? ' ' + dirCls : ''}">
          <div class="inbox-ts">${item.timestamp || ''}</div>
          <div class="inbox-msg">${item.msg || ''}</div>
        </div>`;
      }).join('');
    } catch (e) { /* silently fail */ }
  }

  async function loadAll() {
    await Promise.all([loadData(), loadStock(), loadStatus(), loadInbox()]);
  }

  loadAll();
  setInterval(loadAll, 15000);
</script>
</body>
</html>
