<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bank Stocks</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow+Condensed:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #080b0e;
  --surface: #0e1216;
  --surface2: #12171d;
  --border: #1a2230;
  --accent: #4a9eca;
  --accent2: #7bbde0;
  --green: #2ecc71;
  --red: #e74c3c;
  --text: #c8d4e0;
  --muted: #4a5868;
  --mono: 'Share Tech Mono', monospace;
  --display: 'Barlow Condensed', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--mono); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

header { border-bottom: 1px solid var(--border); padding: 14px 32px; display: flex; align-items: center; gap: 16px; background: var(--surface); flex-shrink: 0; }
.logo { width: 26px; height: 26px; background: var(--accent); clip-path: polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%); flex-shrink: 0; }
header h1 { font-family: var(--display); font-weight: 900; font-size: 24px; letter-spacing: .12em; color: var(--accent); text-transform: uppercase; }
header .subtitle { font-size: 11px; color: var(--muted); letter-spacing: .2em; text-transform: uppercase; margin-left: auto; }

.nav-strip { background: var(--surface2); border-bottom: 1px solid var(--border); padding: 0 28px; display: flex; align-items: center; gap: 2px; flex-shrink: 0; }
.nav-link { font-family: var(--display); font-size: 11px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); text-decoration: none; padding: 9px 14px; border-bottom: 2px solid transparent; transition: all .15s; }
.nav-link:hover { color: var(--text); border-bottom-color: rgba(74,158,202,.4); }
.nav-link.active { color: var(--accent); border-bottom-color: var(--accent); }

.main { display: grid; grid-template-columns: 1fr 260px 260px; flex: 1; overflow: hidden; }

.panel { display: flex; flex-direction: column; overflow: hidden; border-right: 1px solid var(--border); }
.panel:last-child { border-right: none; }
.panel-label { font-family: var(--display); font-size: 11px; font-weight: 700; letter-spacing: .25em; text-transform: uppercase; color: var(--muted); padding: 12px 20px 9px; border-bottom: 1px solid var(--border); flex-shrink: 0; }

/* left stock panel scrolls if too short */
.stock-panel { overflow-y: auto; }

.stock-picker { padding: 16px 20px 0; flex-shrink: 0; }
label { display: block; font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); margin-bottom: 5px; }
select, input[type="text"] { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); font-family: var(--mono); font-size: 13px; padding: 9px 11px; outline: none; transition: border-color .2s; appearance: none; -webkit-appearance: none; height: 38px; }
select:focus, input:focus { border-color: var(--accent); }
select option { background: var(--surface); }

/* price row */
.price-row { display: flex; align-items: baseline; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.stock-price { font-family: var(--display); font-size: 32px; font-weight: 700; }
.stock-sym   { font-size: 12px; color: var(--muted); letter-spacing: .1em; }
.badge { font-family: var(--display); font-size: 13px; font-weight: 700; letter-spacing: .08em; padding: 3px 10px; }
.badge.up   { background: rgba(46,204,113,.15); color: var(--green); }
.badge.down { background: rgba(231,76,60,.15);  color: var(--red);   }

/* chart */
canvas { display: block; width: 100%; height: 150px; background: var(--surface2); flex-shrink: 0; border-bottom: 1px solid var(--border); }

.form-area { padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; flex-shrink: 0; }
.form-title { font-family: var(--display); font-weight: 700; font-size: 18px; letter-spacing: .1em; color: var(--accent2); text-transform: uppercase; }
.form-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.btn { font-family: var(--display); font-weight: 700; font-size: 14px; letter-spacing: .1em; text-transform: uppercase; padding: 0 20px; border: none; cursor: pointer; transition: all .15s; position: relative; overflow: hidden; white-space: nowrap; height: 38px; }
.btn::after { content: ''; position: absolute; inset: 0; background: white; opacity: 0; transition: opacity .15s; }
.btn:hover:not(:disabled)::after { opacity: .07; }
.btn:active:not(:disabled)::after { opacity: .15; }
.btn:disabled { opacity: .3; cursor: not-allowed; }
.btn-green { background: #1a3a28; color: var(--green); border: 1px solid #2a5a3a; }
.btn-red   { background: #3a1a1a; color: var(--red);   border: 1px solid #5a2a2a; }
.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.banner-slot { height: 60px; padding: 8px 20px; flex-shrink: 0; }
.response-banner { height: 100%; display: none; align-items: center; gap: 12px; border-left: 4px solid; padding: 0 16px; animation: bannerIn .2s ease; }
.response-banner.show { display: flex; }
.response-banner.success { border-color: var(--green); background: #0e2a1a; box-shadow: 0 0 20px rgba(46,204,113,.1); }
.response-banner.error   { border-color: var(--red);   background: #2a0e0e; box-shadow: 0 0 20px rgba(231,76,60,.1); }
.banner-icon { font-size: 20px; flex-shrink: 0; }
.banner-body { display: flex; flex-direction: column; gap: 2px; }
.banner-status { font-family: var(--display); font-weight: 700; font-size: 12px; letter-spacing: .2em; text-transform: uppercase; }
.banner-msg { font-size: 12px; opacity: .88; }
.response-banner.success .banner-icon, .response-banner.success .banner-status { color: var(--green); }
.response-banner.success .banner-msg { color: #a8e8c0; }
.response-banner.error .banner-icon, .response-banner.error .banner-status { color: var(--red); }
.response-banner.error .banner-msg { color: #e8a8a0; }
@keyframes bannerIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

.balances-area { flex: 1; overflow-y: auto; }
.company-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; border-bottom: 1px solid var(--border); transition: background .15s; }
.company-row:hover { background: rgba(74,158,202,.04); }
.company-name { font-family: var(--display); font-size: 15px; font-weight: 600; letter-spacing: .04em; }
.company-balance { font-size: 13px; color: var(--accent); font-variant-numeric: tabular-nums; }

.log-area { flex: 1; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
.log-row { padding: 9px 20px; border-bottom: 1px solid #10141a; font-size: 11px; line-height: 1.5; }
.log-row:hover { background: rgba(255,255,255,.015); }
.log-ts { color: var(--muted); display: block; margin-bottom: 2px; }
.log-msg { color: var(--text); }

.refresh-bar { padding: 10px 20px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 10px; background: var(--surface); flex-shrink: 0; }
.refresh-btn { font-family: var(--mono); font-size: 10px; letter-spacing: .15em; text-transform: uppercase; padding: 5px 12px; background: transparent; border: 1px solid var(--border); color: var(--muted); cursor: pointer; transition: all .15s; }
.refresh-btn:hover { border-color: var(--accent); color: var(--accent); }
.last-updated { font-size: 10px; color: var(--muted); }

.empty-state { padding: 40px 20px; text-align: center; color: var(--muted); font-size: 11px; letter-spacing: .1em; }
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); }
</style>
</head>
<body>

<header>
  <div class="logo"></div>
  <h1>Bank Stocks</h1>
  <span class="subtitle">Stock Trading System</span>
</header>

<nav class="nav-strip">
  <a href="bar"    class="nav-link">Bar</a>
  <a href="casino" class="nav-link">Casino</a>
  <a href="transfer" class="nav-link">Transfer</a>
  <a href="stocks"  class="nav-link active">Stocks</a>
  <a href="loans"   class="nav-link">Loans</a>
  <a href="voting"  class="nav-link">Voting</a>
  <a href="events"  class="nav-link">Events</a>
</nav>

<div class="main">

  <!-- PANEL 1: Chart + Trade -->
  <div class="panel">
    <div class="panel-label">Stock Market</div>
    <div class="stock-panel">
      <div class="stock-picker" style="padding-bottom:12px">
        <label>Select Stock</label>
        <select id="stock-sel" onchange="onStockChange()">
          <option value="">— Select Stock —</option>
        </select>
      </div>

      <div class="price-row" id="price-row" style="display:none">
        <span class="stock-price" id="s-price">—</span>
        <span class="stock-sym"   id="s-sym"></span>
        <span class="badge"       id="s-badge"></span>
      </div>

      <canvas id="chart"></canvas>

      <div class="form-area">
        <div class="form-title">Trade</div>
        <div class="form-row2">
          <div>
            <label>Company</label>
            <select id="company-sel" onchange="checkTradeForm()">
              <option value="">— Select Company —</option>
            </select>
          </div>
          <div>
            <label>Shares</label>
            <input type="text" inputmode="numeric" pattern="[0-9]*" id="amount" placeholder="0">
          </div>
        </div>
        <div class="btn-row">
          <button class="btn btn-green" id="btn-buy"  disabled onclick="doTrade('buy')">▲ Buy Stock</button>
          <button class="btn btn-red"   id="btn-sell" disabled onclick="doTrade('sell')">▼ Sell Stock</button>
        </div>
      </div>

      <div class="banner-slot">
        <div class="response-banner" id="banner">
          <div class="banner-icon" id="b-icon"></div>
          <div class="banner-body">
            <div class="banner-status" id="b-status"></div>
            <div class="banner-msg"    id="b-msg"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- PANEL 2: Balances -->
  <div class="panel">
    <div class="panel-label">Company Balances</div>
    <div class="balances-area" id="balances">
      <div class="empty-state">Loading…</div>
    </div>
    <div class="refresh-bar">
      <button class="refresh-btn" onclick="loadAll()">↻ Refresh</button>
      <span class="last-updated" id="last-updated"></span>
    </div>
  </div>

  <!-- PANEL 3: Log -->
  <div class="panel">
    <div class="panel-label">Stock Log</div>
    <div class="log-area" id="log-area">
      <div class="empty-state">Loading…</div>
    </div>
  </div>

</div>

<script>
const BASE = `http://${window.location.hostname}:5000`;
let stocks = [];
let bannerTimer;

function checkTradeForm() {
  const ok = document.getElementById('company-sel').value && document.getElementById('stock-sel').value;
  document.getElementById('btn-buy').disabled  = !ok;
  document.getElementById('btn-sell').disabled = !ok;
}

async function loadAll() {
  await Promise.all([loadCompanies(), loadMarket(), loadLog()]);
  document.getElementById('last-updated').textContent = new Date().toLocaleTimeString();
}

async function loadCompanies() {
  try {
    const r    = await fetch(`${BASE}/api/company/list`);
    const data = await r.json();

    document.getElementById('balances').innerHTML = data.map(c => `
      <div class="company-row">
        <span class="company-name">${c.name}</span>
        <span class="company-balance">${c.balance.toLocaleString()}</span>
      </div>`).join('');

    const sel = document.getElementById('company-sel');
    const cur = sel.value;
    sel.innerHTML = '<option value="">— Select Company —</option>';
    data.forEach(c => {
      const o = document.createElement('option');
      o.value = c.id; o.textContent = c.name;
      sel.appendChild(o);
    });
    if (cur) sel.value = cur;
    checkTradeForm();
  } catch {
    document.getElementById('balances').innerHTML = '<div class="empty-state">Could not reach API</div>';
  }
}

async function loadMarket() {
  try {
    const r    = await fetch(`${BASE}/api/stock/market`);
    const data = await r.json();
    stocks = data.stocks;

    const sel = document.getElementById('stock-sel');
    const cur = sel.value;
    sel.innerHTML = '<option value="">— Select Stock —</option>';
    stocks.forEach(s => {
      const o = document.createElement('option');
      o.value = s.id; o.textContent = `${s.symbol}  —  ${s.name}`;
      sel.appendChild(o);
    });
    if (cur) sel.value = cur;
    onStockChange();
  } catch {}
}

function onStockChange() {
  const id    = parseInt(document.getElementById('stock-sel').value);
  const stock = stocks.find(s => s.id === id);
  checkTradeForm();

  if (!stock) {
    document.getElementById('price-row').style.display = 'none';
    const canvas = document.getElementById('chart');
    canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
    return;
  }

  document.getElementById('price-row').style.display = 'flex';
  document.getElementById('s-price').textContent = `$${stock.current_price.toLocaleString()}`;
  document.getElementById('s-sym').textContent   = stock.symbol;
  const badge = document.getElementById('s-badge');
  badge.textContent = `${stock.change_percent > 0 ? '+' : ''}${stock.change_percent}%`;
  badge.className   = `badge ${stock.trend}`;

  requestAnimationFrame(() => drawChart(stock.history, stock.trend));
}

function drawChart(history, trend) {
  const canvas = document.getElementById('chart');
  canvas.width  = canvas.offsetWidth  || 600;
  canvas.height = canvas.offsetHeight || 150;
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);
  if (!history || history.length < 2) return;

  const min = Math.min(...history) * .995;
  const max = Math.max(...history) * 1.005;
  const rng = max - min || 1;
  const pad = 4;

  const x = i => (i / (history.length - 1)) * (W - pad * 2) + pad;
  const y = p => H - pad - ((p - min) / rng) * (H - pad * 2);

  const col  = trend === 'up' ? '#2ecc71' : '#e74c3c';
  const fill = trend === 'up' ? 'rgba(46,204,113,.1)' : 'rgba(231,76,60,.1)';

  ctx.beginPath();
  ctx.moveTo(x(0), y(history[0]));
  history.forEach((p, i) => { if (i) ctx.lineTo(x(i), y(p)); });
  ctx.lineTo(x(history.length - 1), H);
  ctx.lineTo(x(0), H);
  ctx.closePath();
  ctx.fillStyle = fill;
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(x(0), y(history[0]));
  history.forEach((p, i) => { if (i) ctx.lineTo(x(i), y(p)); });
  ctx.strokeStyle = col;
  ctx.lineWidth   = 2;
  ctx.lineJoin    = 'round';
  ctx.stroke();

  // end dot
  const lx = x(history.length - 1), ly = y(history[history.length - 1]);
  ctx.beginPath();
  ctx.arc(lx, ly, 4, 0, Math.PI * 2);
  ctx.fillStyle = col;
  ctx.fill();
}

async function loadLog() {
  try {
    const r    = await fetch(`${BASE}/api/log/stock`);
    const data = await r.json();
    const el   = document.getElementById('log-area');
    if (!data.length) { el.innerHTML = '<div class="empty-state">No transactions yet</div>'; return; }
    el.innerHTML = [...data].reverse().map(l => `
      <div class="log-row">
        <span class="log-ts">${l.timestamp}</span>
        <span class="log-msg">${l.msg}</span>
      </div>`).join('');
  } catch {
    document.getElementById('log-area').innerHTML = '<div class="empty-state">Could not reach API</div>';
  }
}

async function doTrade(type) {
  const stockId   = parseInt(document.getElementById('stock-sel').value);
  const companyId = parseInt(document.getElementById('company-sel').value);
  const amount    = parseInt(document.getElementById('amount').value);
  if (!amount || amount < 1) { showBanner('Enter a valid share amount', 'error'); return; }
  try {
    const r = await fetch(`${BASE}/api/stock/transaction`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ type, company_id: companyId, stock_id: stockId, amount })
    });
    const d = await r.json();
    showBanner(d.msg, d.status);
    if (d.status === 'success') loadAll();
  } catch {
    showBanner('Could not reach API', 'error');
  }
}

function showBanner(msg, type) {
  const el = document.getElementById('banner');
  document.getElementById('b-icon').textContent   = type === 'success' ? '✓' : '✕';
  document.getElementById('b-status').textContent = type === 'success' ? 'Success' : 'Error';
  document.getElementById('b-msg').textContent    = msg;
  el.className = `response-banner ${type} show`;
  clearTimeout(bannerTimer);
  bannerTimer = setTimeout(() => el.classList.remove('show'), 6000);
}

window.addEventListener('resize', () => {
  const id    = parseInt(document.getElementById('stock-sel').value);
  const stock = stocks.find(s => s.id === id);
  if (stock) drawChart(stock.history, stock.trend);
});

loadAll();
setInterval(loadAll, 30000);
</script>
</body>
</html>
