<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Market Watch</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow+Condensed:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg:      #04060d;
  --surface: #080c18;
  --card:    #0b1020;
  --border:  #141e34;
  --text:    #eef2ff;
  --muted:   #364260;
  --dim:     #1c2438;
  --accent:  #4a9eca;
  --green:   #00d47c;
  --red:     #ff4060;
  --amber:   #ffb020;
  --mono:    'Share Tech Mono', monospace;
  --disp:    'Barlow Condensed', sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--mono);
  display: flex;
  flex-direction: column;
  height: 100vh;
}

/* ── HEADER ── */
header {
  height: 52px;
  background: var(--surface);
  border-bottom: 2px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 28px;
  gap: 18px;
  flex-shrink: 0;
}
.logo {
  width: 26px; height: 26px;
  background: var(--accent);
  clip-path: polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);
  flex-shrink: 0;
}
.brand {
  font-family: var(--disp);
  font-weight: 900;
  font-size: 22px;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--accent);
}
.header-right { display: flex; align-items: center; gap: 20px; margin-left: auto; }
.last-updated { font-size: 11px; color: var(--muted); letter-spacing: .1em; }

.live {
  display: flex; align-items: center; gap: 8px;
  font-family: var(--disp); font-weight: 700; font-size: 13px;
  letter-spacing: .22em; color: var(--green);
}
.live-dot {
  width: 9px; height: 9px; border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 10px var(--green);
  animation: livepulse 2s ease infinite;
}
@keyframes livepulse { 0%,100%{opacity:1;box-shadow:0 0 10px var(--green);} 50%{opacity:.4;box-shadow:none;} }

.clock {
  font-family: var(--disp); font-weight: 700;
  font-size: 22px; letter-spacing: .08em; color: var(--text);
  min-width: 88px; text-align: right;
}

/* ── LAYOUT ── */
.content { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-height: 0; }

/* ── SECTION HEADER ── */
.sec-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 7px 20px 5px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.sec-title {
  font-family: var(--disp); font-weight: 700;
  font-size: 11px; letter-spacing: .3em; text-transform: uppercase; color: var(--muted);
}
.sec-meta { font-size: 10px; color: var(--dim); letter-spacing: .1em; }

/* ── STOCKS ── */
.stocks-section {
  flex: 1; display: flex; flex-direction: column;
  min-height: 0; background: var(--bg);
}
.stocks-grid {
  flex: 1; min-height: 0;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  grid-auto-rows: 1fr;
  gap: 8px;
  padding: 8px 14px;
  overflow: hidden;
}
.stock-card {
  background: var(--card);
  border: 1px solid var(--border);
  padding: 12px 14px 8px;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
  transition: border-color .4s;
}
.stock-card.up   { border-color: rgba(0,212,124,.18); }
.stock-card.down { border-color: rgba(255,64,96,.18);  }

.card-row1 { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 2px; }
.s-symbol {
  font-family: var(--disp); font-weight: 900;
  font-size: 26px; letter-spacing: .05em; color: var(--text);
  line-height: 1;
}
.s-badge {
  font-family: var(--disp); font-weight: 700;
  font-size: 15px; letter-spacing: .06em;
  padding: 3px 10px; border-radius: 2px; line-height: 1.2;
}
.s-badge.up   { background: rgba(0,212,124,.15); color: var(--green); }
.s-badge.down { background: rgba(255,64,96,.15);  color: var(--red);   }

.s-name {
  font-size: 11px; color: var(--muted);
  letter-spacing: .07em; margin-bottom: 5px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.s-price {
  font-family: var(--disp); font-weight: 700;
  font-size: 38px; letter-spacing: .02em; line-height: 1;
  margin-bottom: 6px;
}
.s-price.up   { color: var(--green); }
.s-price.down { color: var(--text);  }

.s-canvas { flex: 1; min-height: 48px; width: 100%; display: block; }

/* flash on price change */
@keyframes flash-up   { 0%,100%{background:var(--card);} 25%{background:rgba(0,212,124,.14);} }
@keyframes flash-down { 0%,100%{background:var(--card);} 25%{background:rgba(255,64,96,.14);} }
.flash-up   { animation: flash-up   .9s ease; }
.flash-down { animation: flash-down .9s ease; }

/* ── BOTTOM ── */
.bottom {
  height: 230px; flex-shrink: 0;
  display: grid; grid-template-columns: 1fr 320px;
  border-top: 2px solid var(--border);
}

/* ── BAR MARKET ── */
.bar-section { border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
.drinks-grid {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  grid-auto-rows: 1fr;
  gap: 5px;
  padding: 8px 12px;
  overflow: hidden;
  align-content: start;
}
.drink-item {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 10px;
  background: var(--card); border: 1px solid var(--border);
}
.d-name {
  font-family: var(--disp); font-size: 17px; font-weight: 600;
  letter-spacing: .04em; flex: 1;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.d-chart { flex-shrink: 0; display: block; }
.d-price {
  font-size: 16px; color: var(--amber);
  font-variant-numeric: tabular-nums; white-space: nowrap; flex-shrink: 0;
}

/* ── NEWS ── */
.news-section { display: flex; flex-direction: column; overflow: hidden; background: var(--surface); }
.news-list {
  flex: 1; overflow-y: auto;
  scrollbar-width: thin; scrollbar-color: var(--border) transparent;
}
.news-item { padding: 7px 16px; border-bottom: 1px solid var(--bg); }
.news-item:hover { background: rgba(255,255,255,.02); }
.news-ts    { font-size: 10px; color: var(--muted); display: block; margin-bottom: 2px; }
.news-title { font-family: var(--disp); font-weight: 700; font-size: 13px; color: var(--accent); display: block; margin-bottom: 2px; letter-spacing: .04em; }
.news-msg   { font-size: 12px; color: var(--text); opacity: .78; line-height: 1.4; }

.empty-state { padding: 24px; text-align: center; color: var(--muted); font-size: 11px; letter-spacing: .12em; }

::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); }
</style>
</head>
<body>

<header>
  <div class="logo"></div>
  <span class="brand">Maus of RoadStreet</span>
  <div class="header-right">
    <span class="last-updated" id="last-updated"></span>
    <div class="live"><div class="live-dot"></div>LIVE</div>
    <span class="clock" id="clock"></span>
  </div>
</header>

<div class="content">

  <!-- STOCKS (main focus) -->
  <section class="stocks-section">
    <div class="sec-head">
      <span class="sec-title">Stock Market</span>
      <span class="sec-meta" id="stock-meta"></span>
    </div>
    <div class="stocks-grid" id="stocks-grid">
      <div class="empty-state" style="grid-column:1/-1">Loading market data…</div>
    </div>
  </section>

  <!-- BOTTOM ROW -->
  <div class="bottom">

    <!-- BAR MARKET -->
    <section class="bar-section">
      <div class="sec-head">
        <span class="sec-title">Bar Market</span>
      </div>
      <div class="drinks-grid" id="drinks-grid">
        <div class="empty-state" style="grid-column:1/-1">Loading…</div>
      </div>
    </section>

    <!-- NEWS (secondary) -->
    <section class="news-section">
      <div class="sec-head">
        <span class="sec-title">Recent News</span>
      </div>
      <div class="news-list" id="news-list">
        <div class="empty-state">Loading…</div>
      </div>
    </section>

  </div>
</div>

<script>
const BASE    = `http://${window.location.hostname}`;
const REFRESH = 12000;
let prevPrices = {};

/* ── Clock ── */
function tick() {
  const n = new Date();
  document.getElementById('clock').textContent =
    String(n.getHours()).padStart(2,'0') + ':' +
    String(n.getMinutes()).padStart(2,'0') + ':' +
    String(n.getSeconds()).padStart(2,'0');
}
setInterval(tick, 1000);
tick();

/* ── Sparkline ── */
function drawSparkline(canvas, history, trend, fixedW, fixedH) {
  if (!canvas) return;
  canvas.width  = fixedW || canvas.offsetWidth  || 200;
  canvas.height = fixedH || canvas.offsetHeight || 60;
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);
  if (!history || history.length < 2) return;

  const min  = Math.min(...history) * .993;
  const max  = Math.max(...history) * 1.007;
  const rng  = max - min || 1;
  const pad  = 2;
  const toX  = i => (i / (history.length - 1)) * (W - pad*2) + pad;
  const toY  = p => H - pad - ((p - min) / rng) * (H - pad*2);
  const isUp = trend === 'up';
  const col  = isUp ? '#00d47c' : '#ff4060';

  /* gradient fill */
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, isUp ? 'rgba(0,212,124,.28)' : 'rgba(255,64,96,.28)');
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.beginPath();
  ctx.moveTo(toX(0), toY(history[0]));
  history.forEach((p,i) => { if (i) ctx.lineTo(toX(i), toY(p)); });
  ctx.lineTo(toX(history.length-1), H);
  ctx.lineTo(toX(0), H);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();

  /* line */
  ctx.beginPath();
  ctx.moveTo(toX(0), toY(history[0]));
  history.forEach((p,i) => { if (i) ctx.lineTo(toX(i), toY(p)); });
  ctx.strokeStyle = col;
  ctx.lineWidth   = 2;
  ctx.lineJoin    = 'round';
  ctx.stroke();

  /* end dot */
  const lx = toX(history.length-1), ly = toY(history[history.length-1]);
  ctx.beginPath();
  ctx.arc(lx, ly, 3, 0, Math.PI*2);
  ctx.fillStyle = col;
  ctx.fill();
}

/* ── Stocks ── */
async function loadStocks() {
  try {
    const r    = await fetch(`${BASE}/api/stock/market`);
    const data = await r.json();
    document.getElementById('stock-meta').textContent = `Last updated: ${data.last_updated}`;
    renderStocks(data.stocks);
  } catch {
    document.getElementById('stocks-grid').innerHTML =
      '<div class="empty-state" style="grid-column:1/-1">Could not reach API</div>';
  }
}

function renderStocks(stocks) {
  const grid = document.getElementById('stocks-grid');
  grid.innerHTML = stocks.map(s => {
    const key     = `s${s.id}`;
    const prev    = prevPrices[key];
    const changed = prev !== undefined && prev !== s.current_price;
    const flashCls = changed
      ? (s.current_price > prev ? ' flash-up' : ' flash-down')
      : '';
    prevPrices[key] = s.current_price;
    const sign = s.change_percent >= 0 ? '+' : '';
    return `
      <div class="stock-card ${s.trend}${flashCls}">
        <div class="card-row1">
          <span class="s-symbol">${s.symbol}</span>
          <span class="s-badge ${s.trend}">${sign}${s.change_percent}%</span>
        </div>
        <div class="s-name">${s.name}</div>
        <div class="s-price ${s.trend}">$${s.current_price.toLocaleString()}</div>
        <canvas class="s-canvas" id="sc-${s.id}"
          data-h='${JSON.stringify(s.history)}' data-t="${s.trend}"></canvas>
      </div>`;
  }).join('');

  requestAnimationFrame(() => {
    stocks.forEach(s => {
      const c = document.getElementById(`sc-${s.id}`);
      if (c) drawSparkline(c, s.history, s.trend);
    });
  });
}

/* ── Bar Market ── */
async function loadBar() {
  try {
    const r    = await fetch(`${BASE}/api/bar/market`);
    const data = await r.json();
    renderDrinks(data);
  } catch {
    document.getElementById('drinks-grid').innerHTML =
      '<div class="empty-state" style="grid-column:1/-1">Could not reach API</div>';
  }
}

function renderDrinks(drinks) {
  const grid = document.getElementById('drinks-grid');
  grid.innerHTML = drinks.map(d => {
    const price   = d.current_price ?? d.worth ?? 0;
    const key     = `d${d.id}`;
    const prev    = prevPrices[key];
    const changed = prev !== undefined && prev !== price;
    const isUp    = d.history?.length > 1
      ? d.history[d.history.length-1] >= d.history[d.history.length-2]
      : true;
    const flashCls = changed ? (isUp ? ' flash-up' : ' flash-down') : '';
    prevPrices[key] = price;
    return `
      <div class="drink-item${flashCls}">
        <span class="d-name">${d.asset_name}</span>
        <canvas class="d-chart" id="dc-${d.id}" width="64" height="28"
          data-h='${JSON.stringify(d.history || [])}' data-up="${isUp}"></canvas>
        <span class="d-price">$${price.toLocaleString()}</span>
      </div>`;
  }).join('');

  requestAnimationFrame(() => {
    drinks.forEach(d => {
      const c = document.getElementById(`dc-${d.id}`);
      if (c && d.history?.length > 1) {
        const trend = d.history[d.history.length-1] >= d.history[0] ? 'up' : 'down';
        drawSparkline(c, d.history, trend, 64, 28);
      }
    });
  });
}

/* ── News ── */
async function loadNews() {
  try {
    const r    = await fetch(`${BASE}/api/log/news`);
    const data = await r.json();
    const el   = document.getElementById('news-list');
    if (!data.length) { el.innerHTML = '<div class="empty-state">No news yet</div>'; return; }
    el.innerHTML = [...data].reverse().slice(0, 30).map(n => `
      <div class="news-item">
        <span class="news-ts">${n.timestamp}</span>
        ${n.title ? `<span class="news-title">${n.title}</span>` : ''}
        <span class="news-msg">${n.msg}</span>
      </div>`).join('');
  } catch {
    document.getElementById('news-list').innerHTML = '<div class="empty-state">Could not reach API</div>';
  }
}

/* ── Resize: redraw all charts ── */
window.addEventListener('resize', () => {
  document.querySelectorAll('.s-canvas').forEach(c => {
    const h = JSON.parse(c.dataset.h || '[]');
    if (h.length > 1) drawSparkline(c, h, c.dataset.t);
  });
});

/* ── Main loop ── */
async function loadAll() {
  await Promise.all([loadStocks(), loadBar(), loadNews()]);
  document.getElementById('last-updated').textContent =
    'Updated ' + new Date().toLocaleTimeString();
}

loadAll();
setInterval(loadAll, REFRESH);
</script>
</body>
</html>
