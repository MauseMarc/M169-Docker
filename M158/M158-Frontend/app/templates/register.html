<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — Maus of Roadstreetdstreet</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0a0e0a;
    color: #c8d8c0;
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }

  .card {
    background: #111a11;
    border: 1px solid #2a3d2a;
    border-radius: 4px;
    width: 100%;
    max-width: 420px;
    padding: 32px 28px;
  }

  .card-header {
    text-align: center;
    margin-bottom: 28px;
  }

  .card-header .logo {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 26px;
    color: #5dba5d;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .card-header .subtitle {
    font-size: 11px;
    color: #6a8a6a;
    margin-top: 4px;
    letter-spacing: 1px;
  }

  .invite-badge {
    background: #0d160d;
    border: 1px solid #2a3d2a;
    border-radius: 3px;
    padding: 8px 12px;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
  }

  .invite-badge .label {
    color: #6a8a6a;
    flex-shrink: 0;
  }

  .invite-badge .code {
    color: #5dba5d;
    font-weight: bold;
    letter-spacing: 2px;
  }

  .form-group {
    margin-bottom: 18px;
  }

  label {
    display: block;
    font-size: 11px;
    color: #6a8a6a;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  input[type="text"], select {
    width: 100%;
    background: #0d160d;
    border: 1px solid #2a3d2a;
    color: #c8d8c0;
    font-family: 'Share Tech Mono', monospace;
    font-size: 14px;
    padding: 10px 12px;
    border-radius: 3px;
    outline: none;
    transition: border-color 0.15s;
    appearance: none;
    -webkit-appearance: none;
  }

  input[type="text"]:focus, select:focus {
    border-color: #5dba5d;
  }

  input[type="text"]::placeholder {
    color: #3a5a3a;
  }

  select option {
    background: #0d160d;
    color: #c8d8c0;
  }

  .btn {
    width: 100%;
    padding: 12px;
    background: #1a3a1a;
    border: 1px solid #5dba5d;
    color: #5dba5d;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 3px;
    transition: background 0.15s, color 0.15s;
    margin-top: 8px;
  }

  .btn:hover:not(:disabled) {
    background: #5dba5d;
    color: #0a0e0a;
  }

  .btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }

  .banner-slot {
    height: 52px;
    flex-shrink: 0;
    margin-top: 14px;
  }

  .response-banner {
    display: none;
    align-items: center;
    height: 100%;
    padding: 0 14px;
    border-radius: 3px;
    font-size: 13px;
    border: 1px solid transparent;
  }

  .response-banner.success {
    display: flex;
    background: #0d2a0d;
    border-color: #2a7a2a;
    color: #5dba5d;
  }

  .response-banner.error {
    display: flex;
    background: #2a0d0d;
    border-color: #7a2a2a;
    color: #d07070;
  }
</style>
</head>
<body>

<div class="card">
  <div class="card-header">
    <div class="logo">Maus of Roadstreet</div>
    <div class="subtitle">Register Your Company</div>
  </div>

  <div class="invite-badge">
    <span class="label">INVITE CODE</span>
    <span class="code">{{ invite_code }}</span>
  </div>

  <div class="form-group">
    <label for="company-name">Company Name</label>
    <input type="text" id="company-name" placeholder="Enter company name" oninput="checkForm()">
  </div>

  <div class="form-group">
    <label for="shortform">Ticker / Short Name <span style="color:#3a5a3a">(max 4 letters)</span></label>
    <input type="text" id="shortform" placeholder="XXXX" maxlength="4" oninput="this.value=this.value.replace(/[^A-Za-z]/g,'').toUpperCase(); checkForm()">
  </div>

  <div class="form-group">
    <label for="company-type">Company Type</label>
    <select id="company-type" onchange="checkForm()">
      <option value="">— Select Type —</option>
      {% for t in company_types %}
      <option value="{{ t }}">{{ t | capitalize }}</option>
      {% endfor %}
    </select>
  </div>

  <button class="btn" id="register-btn" disabled onclick="doRegister()">Register</button>

  <div class="banner-slot">
    <div class="response-banner" id="banner"></div>
  </div>
</div>

<script>
  const INVITE_CODE = {{ invite_code | tojson }};

  function checkForm() {
    const name      = document.getElementById('company-name').value.trim();
    const type      = document.getElementById('company-type').value;
    const shortform = document.getElementById('shortform').value.trim();
    document.getElementById('register-btn').disabled = !(name && type && shortform.length >= 1);
  }

  function showBanner(msg, type) {
    const el = document.getElementById('banner');
    el.className = 'response-banner ' + type;
    el.textContent = msg;
  }

  async function doRegister() {
    const name      = document.getElementById('company-name').value.trim();
    const type      = document.getElementById('company-type').value;
    const shortform = document.getElementById('shortform').value.trim();
    const btn       = document.getElementById('register-btn');

    btn.disabled = true;

    try {
      const resp = await fetch('/player/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          invite_code: INVITE_CODE,
          company_name: name,
          company_type: type,
          shortform: shortform
        })
      });
      const data = await resp.json();
      if (data.status === 'success') {
        // Set cookie
        document.cookie = `invite_code=${INVITE_CODE}; path=/; max-age=2592000; SameSite=Lax`;
        showBanner('Registration successful! Loading dashboard…', 'success');
        setTimeout(() => {
          window.location.href = `/join?code=${encodeURIComponent(INVITE_CODE)}`;
        }, 1200);
      } else {
        showBanner(data.msg || 'Registration failed.', 'error');
        btn.disabled = false;
      }
    } catch (e) {
      showBanner('Could not reach server.', 'error');
      btn.disabled = false;
    }
  }
</script>
</body>
</html>
