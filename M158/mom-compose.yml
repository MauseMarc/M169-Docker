services:
  webserver:
    image: ghcr.io/mausemarc/mausegibb-projekte/mom-frontend:v1
    ports:
      - "80:80"
    restart: always
    networks:
      - mom
  backend:
    image: ghcr.io/mausemarc/mausegibb-projekte/mom-backend:v1
    ports:
      - "5000:5000"
    restart: always
    environment:
      # alles platzhalter
      - DB_HOST=db #name des Datenbank service
      - DB_USER=Gamemaster
      - DB_PASSWORD=timoistdaspasswort
      - DB_NAME=mom_db
      - DB_PORT=3306
    depends_on:
      - db
    networks:
      - mom
  db:
    image: mariadb:10.6.27-ubi9
    ports:
      - "3306"
    restart: always
    environment:
      # platzhalter
      MARIADB_ROOT_PASSWORD: timoistdaspasswort
      MARIADB_DATABASE: mom_db
      MARIADB_USER: Gamemaster
      MARIADB_PASSWORD: timoistdaspasswort
    volumes:
      - persistent_data:/var/lib/mysql # Folder named persistent_data idk yet where it's stored

      # the sql dump has to be named migration.sql and be located inside the M158-Database folder
      #  /docker-entrypoint-initdb.d    ist der ordner für die Initialisierung. Wird nur gebraucht beim ersten Start. liest automatisch .sql dateien
      - ./M158-Database/migration.sql:/docker-entrypoint-initdb.d/migration.sql:ro # ro means read only
    networks:
      - mom

networks:
  mom:
    name: mom
    driver: bridge

volumes:
  persistent_data:
